<div class="min-h-screen bg-blue-50 py-10 px-4 flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    
    <h2 class="text-2xl text-center font-bold text-blue-700 mb-6">Inscription</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Nom utilisateur -->
      <div>
        <label class="block text-blue-600 font-medium mb-1">Nom d'utilisateur</label>
        <input type="text" class="w-full px-4 py-2 border-2 border-blue-200 rounded-md focus:outline-none focus:border-blue-500"
               formControlName="nomUtilisateur" />
        <div *ngIf="registerForm.get('nomUtilisateur')?.hasError('specialChars') && registerForm.get('nomUtilisateur')?.touched">
          <p class="text-red-600 text-sm mt-1">Les caractères spéciaux ne sont pas autorisés.</p>
        </div>
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-blue-600 font-medium mb-1">Mot de passe</label>
        <input type="password" class="w-full px-4 py-2 border-2 border-blue-200 rounded-md focus:outline-none focus:border-blue-500"
               formControlName="motDePasse" />
        <div *ngIf="registerForm.get('motDePasse')?.hasError('weakPassword') && registerForm.get('motDePasse')?.touched">
          <p class="text-red-600 text-sm mt-1">
            Mot de passe trop faible. Il doit contenir au moins 8 caractères, une majuscule, une minuscule, un chiffre et un caractère spécial.
          </p>
        </div>
      </div>

      <!-- Rôle -->
      <div>
        <label class="block text-blue-600 font-medium mb-1">Rôle</label>
        <select class="w-full px-4 py-2 border-2 border-blue-200 rounded-md bg-blue-50 focus:outline-none focus:border-blue-500"
                formControlName="role">
          <option value="UTILISATEUR">Utilisateur</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <!-- Message erreur -->
      <div *ngIf="errorMessage" class="bg-red-100 text-red-700 px-4 py-2 rounded-md border-l-4 border-red-500">
        {{ errorMessage }}
      </div>

      <!-- Message succès -->
      <div *ngIf="successMessage" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-md border-l-4 border-blue-500">
        {{ successMessage }}
      </div>

      <!-- Bouton -->
      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-md transition">
        S'inscrire
      </button>

      <!-- Lien vers login -->
      <div class="text-center mt-3">
        <a routerLink="/login" class="text-sm text-blue-600 hover:underline">Déjà inscrit ? Se connecter</a>
      </div>

    </form>
  </div>
</div>
