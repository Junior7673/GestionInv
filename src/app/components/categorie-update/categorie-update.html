<div class="container mt-5">
  <h2 class="text-center mb-4">Modifier une Catégorie</h2>
  
  <div class="mb-3">
    <button class="btn btn-secondary" (click)="goBack()">← Retour</button>
  </div>

  <form [formGroup]="categorieForm" (ngSubmit)="update()" class="card p-4 shadow-sm">
    
    <div class="mb-3">
      <label class="form-label">Nom de la catégorie</label>
      <input type="text" formControlName="nomcat" class="form-control" placeholder="Entrez le nom de la catégorie">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea formControlName="descriptioncat" class="form-control" placeholder="Entrez la description"></textarea>
    </div>

    <div class="d-grid">
      <button type="submit" class="btn btn-primary">Modifier la catégorie</button>
    </div>
  </form>
</div>
