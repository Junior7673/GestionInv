<div class="container mt-5">
  <h2 class="text-center mb-4">Liste des Entrées</h2>
  <div class="mb-3">
    <button class="btn btn-secondary" (click)="goBack()">← Retour</button>
    <input type="text"
         [(ngModel)]="searchTerm"
         placeholder="🔍 Rechercher par produit, stock, date..."
         class="form-control search-input"
    />
  </div>

  <table class="table table-bordered shadow-sm">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Produit</th>
        <th>Stock</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
          @for(entree of filteredEntrees; track entree.id){            
            <tr>
                <td>{{ entree.id }}</td>
                <td>{{ entree.nomprod }}</td>
                <td>{{ entree.stock }}</td>
                <td>{{ entree.date }}</td>
                <td>
                  <button class="btn btn-sm btn-warning me-2" (click)="modifierEntree(entree.id)">Modifier</button>
                <button class="btn btn-sm btn-danger" (click)="supp(entree.id)">Supprimer</button>
                </td>
            </tr>
        }
    </tbody>
  </table>

  @if(entrees.length === 0){
    <div *ngIf="" class="text-center text-muted">
        Aucune entrées trouvée.
    </div>
  }
</div>
