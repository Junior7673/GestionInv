<div class="container mt-5">
  <h2 class="text-center mb-4">Liste des Catégories</h2>

  <table class="table table-bordered shadow-sm">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categories; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ cat.nomcat }}</td>
        <td>{{ cat.descriptioncat }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="modifierCategorie(cat.id)">Modifier</button>
          <button class="btn btn-sm btn-danger" (click)="supprimerCategorie(cat.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="categories.length === 0" class="text-center text-muted">
    Aucune catégorie trouvée.
  </div>
</div>
