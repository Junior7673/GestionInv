<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
  <div class="space-y-12">
    <div class="border-b border-gray-900/10 pb-12">
      <div class="flex justify-between">
        <h2 class="text-xl font-semibold text-gray-900 cursor-pointer" (click)="goBack()">← Nouvel Catégorie</h2>

        <button type="submit" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
          Enregistrer
        </button>
      </div>

      <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

        <div class="sm:col-span-6">
          <label for="nomcat" class="block text-sm/6 font-medium text-gray-900">Nom</label>
          <div class="mt-2">
            <input id="nomcat" type="text" formControlName="nomcat" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 capitalize" />
          </div>
        </div>

        <div class="sm:col-span-6">
          <label for="descriptioncat" class="block text-sm/6 font-medium text-gray-900">Description</label>
          <div class="mt-2">
            <textarea id="descriptioncat" type="number" formControlName="descriptioncat" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"></textarea>
          </div>
        </div>

      </div>
    </div>
  </div>
</form>
