<form [formGroup]="sortieForm" (ngSubmit)="update()">
  <div class="space-y-12">
    <div class="border-b border-gray-900/10 pb-12">
      <div class="flex justify-between">
        <h2 class="text-xl font-semibold text-gray-900 cursor-pointer" (click)="goBack()">← Nouvelle Sortie</h2>

        <button type="submit" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
          Enregistrer
        </button>
      </div>

      <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

        <div class="sm:col-span-6">
          <label for="produitText" class="block text-sm/6 font-medium text-gray-900">Produit</label>
          <div class="mt-2">
            <input type="hidden" formControlName="produitId">
            <input id="produitText" type="text" (keyup)="searchProduit()" formControlName="produitText" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 capitalize" />
            @if(produits.length > 0){
              <ul class="bg-white rounded-lg text-gray-900">
                  @for(produit of produits; track produit.id){
                    <li class="px-3 py-2 border-b border-gray-200 w-full rounded-t-lg" (click)="pickProduit(produit)">{{produit.nomprod}}</li>
                  }
              </ul>
            }
          </div>
        </div>

        <div class="sm:col-span-6">
          <label for="stock" class="block text-sm/6 font-medium text-gray-900">Stock</label>
          <div class="mt-2">
            <input id="stock" type="number" formControlName="stock" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
          </div>
        </div>

        <div class="sm:col-span-3">
          <label for="date" class="block text-sm/6 font-medium text-gray-900">Date</label>
          <div class="mt-2">
            <input id="date" type="date" formControlName="date" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
          </div>
        </div>

      </div>
    </div>
  </div>
</form>
