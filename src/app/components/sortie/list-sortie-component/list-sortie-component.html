<div class="container mt-5">
  <h2 class="text-center mb-4">Liste des Sorties</h2>
  <div class="mb-3">
    <button class="btn btn-secondary" (click)="goBack()">← Retour</button>
    <input type="text"
         [(ngModel)]="searchTerm"
         placeholder="🔍 Rechercher par produit, stock, date..."
         class="form-control search-input"
    />
  </div>

  <table class="table table-bordered shadow-sm">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Produit</th>
        <th>Stock</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sortie of filteredSorties; trackBy: trackById">         
        <td>{{ sortie.id }}</td>
        <td>{{ sortie.nomprod }}</td>
        <td>{{ sortie.stock }}</td>
        <td>{{ sortie.date | date:'shortDate' }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="modifierSortie(sortie.id)">Modifier</button>
          <button class="btn btn-sm btn-danger" (click)="supp(sortie.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="filteredSorties.length === 0" class="text-center text-muted">
    Aucune sortie trouvée.
  </div>
</div>
